<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Breakpoint</title>
<meta name="description" content="That page is not here.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230A0A0A'/><rect x='2' y='2' width='28' height='28' fill='none' stroke='%23E61919'/><text x='16' y='22' font-family='monospace' font-size='12' fill='%23EAEAEA' text-anchor='middle'>BP</text></svg>">
<script>
  (function () {
    try {
      if (localStorage.getItem('theme') === 'light')
        document.documentElement.setAttribute('data-theme', 'light');
      if (localStorage.getItem('scan') === 'off')
        document.documentElement.setAttribute('data-scan', 'off');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F4F4F0; --surface:#FFFFFF; --surface-2:#EAE8E3;
    --ink:#0A0A0A; --ink-soft:#222; --ink-mute:#5F5F5C;
    --line:#D2D0CA; --line-strong:#0A0A0A;
    --red:#C41414;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  [data-theme="dark"]{
    --canvas:#0A0A0A; --surface:#111111; --surface-2:#080808;
    --ink:#EAEAEA; --ink-soft:#C8C8C8; --ink-mute:#8A8A8A;
    --line:#2A2A2A; --line-strong:#3D3D3D;
    --red:#E61919;
  }
  *,*::before,*::after{box-sizing:border-box;border-radius:0}
  body{
    margin:0;background:var(--canvas);color:var(--ink-soft);
    font-family:var(--mono);font-size:16.8px;line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--red);color:var(--canvas)}

  html[data-theme="dark"] body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.30;
    background:repeating-linear-gradient(0deg,
      transparent,transparent 2px,rgba(0,0,0,.55) 2px,rgba(0,0,0,.55) 4px);
  }
  html[data-scan="off"] body::after{display:none!important}
  html[data-theme="light"] body::after{display:none!important}

  .skip{
    position:absolute;left:-9999px;top:0;background:var(--red);color:var(--canvas);
    padding:10px 16px;font-size:13.2px;letter-spacing:.1em;text-transform:uppercase;z-index:9999;
  }
  .skip:focus{left:8px;top:8px}

  .topbar{background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar-in{
    max-width:1120px;margin:0 auto;padding:0 24px;height:56px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:15.6px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
  .brand .mark{
    width:22px;height:22px;display:grid;place-items:center;
    border:1px solid var(--red);color:var(--red);
    font-size:12px;letter-spacing:-.05em;
  }
  .tools{display:flex;align-items:center;gap:8px}
  .btn{
    appearance:none;background:transparent;border:1px solid var(--line-strong);
    color:var(--ink-mute);font-family:var(--mono);font-size:10.8px;
    letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;cursor:pointer;
  }
  .btn:hover{color:var(--red);border-color:var(--red)}
  .ic-sun{display:none}
  [data-theme="dark"] .ic-sun{display:block}
  [data-theme="dark"] .ic-moon{display:none}

  main{max-width:760px;margin:0 auto;padding:64px 24px 0}
  .kicker{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--red);margin-bottom:16px;
  }
  h1{
    font-family:'Archivo Black','Arial Black',system-ui,sans-serif;
    font-weight:400;text-transform:uppercase;letter-spacing:-.04em;
    line-height:.95;font-size:clamp(2.2rem,7vw,4rem);
    color:var(--ink);margin:0 0 18px;
  }
  .lede{font-size:17.4px;line-height:1.75;color:var(--ink-mute);margin:0}
  .rule{height:3px;background:var(--red);margin:34px 0 0}

  .links{list-style:none;margin:0;padding:0}
  .links li{border-bottom:1px solid var(--line)}
  .links a{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;
    padding:20px 0;align-items:baseline}
  .links a:hover .t{color:var(--red)}
  .links .d{font-size:11.4px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute)}
  .links .t{
    font-family:'Archivo Black','Arial Black',system-ui,sans-serif;
    font-size:1.1rem;line-height:1.2;text-transform:uppercase;
    letter-spacing:-.02em;color:var(--ink);
  }
  .links .k{display:block;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--red);margin-bottom:4px}

  .back{display:inline-block;margin-top:36px;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--red);
    padding-bottom:3px}
  .back:hover{color:var(--red)}

  footer{
    border-top:1px solid var(--line);margin-top:64px;padding:24px 0 64px;
    display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);
  }
  .foot-links{display:flex;gap:18px}
  .foot-links a:hover{color:var(--red)}
  @media (max-width:700px){
    main{padding:40px 20px 0}
    .topbar-in{padding:0 20px}
    .links a{grid-template-columns:1fr;gap:4px}
  }
  :focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<div class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/">
      <span class="mark">BP</span>
      <span>Breakpoint</span>
    </a>
    <div class="tools">
      <button id="scan-toggle" class="btn" type="button"
              aria-label="Toggle scanlines" title="Toggle scanlines">SCAN</button>
      <button id="theme-toggle" class="btn" type="button"
              aria-label="Toggle colour theme" title="Toggle colour theme">
        <svg class="ic ic-sun" width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
        </svg>
        <svg class="ic ic-moon" width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M20 14.5A8.2 8.2 0 1 1 9.5 4a6.6 6.6 0 0 0 10.5 10.5z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<main id="main">
  <div class="kicker">[ 404 ]</div>
  <h1>No signal here</h1>
  <p class="lede">
    That page is not in the index. The posts that are:
  </p>

  <div class="rule"></div>

  <ul class="links">
    <li>
      <a href="/rag-poisoning/">
        <span class="d">14 Oct 2026</span>
        <span><span class="k">AI Security</span><span class="t">Nine of Ten</span></span>
      </a>
    </li>
    <li>
      <a href="/cve-2023-24033/">
        <span class="d">12 Aug 2026</span>
        <span><span class="k">Baseband</span><span class="t">The Eleventh Slot</span></span>
      </a>
    </li>
  </ul>

  <a class="back" href="/">&larr; All posts</a>

  <footer>
    <span>&copy; 2026 Amit Vitekar</span>
    <span class="foot-links">
      <a href="https://www.linkedin.com/in/amitvitekar/" rel="me noopener">LinkedIn</a>
      <a href="https://x.com/r00tb3" rel="me noopener">X</a>
    </span>
  </footer>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var theme = document.getElementById('theme-toggle');
    var scan = document.getElementById('scan-toggle');
    if (theme) theme.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    if (scan) scan.addEventListener('click', function () {
      var off = root.getAttribute('data-scan') === 'off';
      root.setAttribute('data-scan', off ? 'on' : 'off');
      try { localStorage.setItem('scan', off ? 'on' : 'off'); } catch (e) {}
    });
  })();
</script>
</body>
</html>
